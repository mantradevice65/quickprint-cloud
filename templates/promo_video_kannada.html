<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPrint - Realistic Kannada Shop Promotional Video | Ameer Solapur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      font-family: 'Noto Sans Kannada', 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
      overflow-x: hidden;
    }

    /* Top Control Bar */
    .controls-bar {
      width: 100%;
      max-width: 960px;
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      color: #60a5fa;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-download {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22,163,74,0.4);
      font-size: 13.5px;
    }
    .btn-download:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(22,163,74,0.5);
      background: #15803d;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
    }

    .btn-aspect {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-aspect.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* Video Player Container */
    .player-container {
      position: relative;
      background: #000000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 0 2px #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 9:16 Reel Mode */
    .player-container.reel-mode {
      width: 440px;
      height: 780px;
      max-width: 96vw;
      max-height: 82vh;
    }

    /* 16:9 Landscape Mode */
    .player-container.landscape-mode {
      width: 960px;
      height: 540px;
      max-width: 96vw;
      max-height: 80vh;
    }

    #videoCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0f172a;
    }

    /* Overlay Controls */
    .overlay-hud {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
      padding: 16px 18px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 4px;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
    }

    .scene-indicator {
      font-size: 12px;
      background: rgba(59, 130, 246, 0.3);
      border: 1px solid rgba(59, 130, 246, 0.6);
      padding: 3px 10px;
      border-radius: 12px;
      color: #93c5fd;
    }

    /* Start Overlay */
    .start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    .play-circle {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(37,99,235,0.5);
      transition: transform 0.2s;
    }
    .play-circle:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Controls Bar -->

  <!-- Player Stage -->
  <div class="player-container reel-mode" id="playerWrapper">
    <canvas id="videoCanvas" width="720" height="1280"></canvas>

    <!-- Initial Play Overlay -->
    <div class="start-overlay" id="startOverlay">
      <div class="play-circle" onclick="startVideoWithSound()">▶</div>
      <div style="font-size:23px; font-weight:900; color:#ffffff;">

        ರಿಯಲ್ ಕಸ್ಟಮರ್ & ಅಂಗಡಿಯವರ ಕನ್ನಡ ಸಂಭಾಷಣೆಯೊಂದಿಗೆ!
      </div>

        (ಪ್ಲೇ ಮಾಡಲು Click ಮಾಡಿ)

    <!-- HUD Overlay -->
    <div class="overlay-hud">
      <div class="progress-bar-container" onclick="seekVideo(event)">
        <div class="progress-fill" id="progressFill"></div>

      <div class="hud-row">
        <div class="hud-actions">
          <button class="hud-btn" id="btnPlayPause" onclick="togglePlay()">⏸</button>
          <button class="hud-btn" id="btnMute" onclick="toggleMute()">🔊</button>
          <span id="timeDisplay" style="color:#cbd5e1; font-family:'Plus Jakarta Sans', monospace;">0:00 / 0:32</span>
        </div>
        <div class="scene-indicator" id="sceneIndicator">
          ದೃಶ್ಯ 1: ಕಸ್ಟಮರ್ ಎಂಟ್ರಿ
        </div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let isMuted = false;
    let isPlaying = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const sceneIndicator = document.getElementById('sceneIndicator');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnMute = document.getElementById('btnMute');

    const TOTAL_DURATION = 32.0;
    let currentTime = 0.0;
    let lastTimestamp = 0;

    // Scenes with Real Character Dialogues
    const SCENES = [
      {
        id: 1,
        start: 0.0,
        end: 7.5,
        title: "ದೃಶ್ಯ 1: ಕಸ್ಟಮರ್ & ಅಂಗಡಿಯವರ ಮಾತುಕತೆ",
        speaker: "customer",
        dialogue: "ಕಸ್ಟಮರ್: 'ಅಣ್ಣಾ, ಈ ಡಾಕ್ಯುಮೆಂಟ್ ಪ್ರಿಂಟ್ ತೆಗಿಬೇಕು, WhatsApp ನಂಬರ್ ಕೊಡ್ತೀರಾ?'",
        reply: "ಅಂಗಡಿಯವರು: 'ನೋಡಿ ತಮ್ಮಾ, WhatsApp ಬೇಡ! ಈ QR ಕೋಡ್ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ!'",
        voiceText: "ಅಣ್ಣಾ, ಈ ಡಾಕ್ಯುಮೆಂಟ್ ಪ್ರಿಂಟ್ ತೆಗಿಬೇಕು, WhatsApp ನಂಬರ್ ಕೊಡ್ತೀರಾ?"
      },
      {
        id: 2,
        start: 7.5,
        end: 15.0,
        title: "ದೃಶ್ಯ 2: 1 ಸೆಕೆಂಡಿನಲ್ಲಿ ಕ್ಯೂಆರ್ ಸ್ಕ್ಯಾನ್ & ಅಪ್ಲೋಡ್",
        speaker: "shopkeeper",
        dialogue: "ಅಂಗಡಿಯವರು: 'QR ಸ್ಕ್ಯಾನ್ ಮಾಡಿ, ಫೈಲ್ ಅಪ್ಲೋಡ್ ಮಾಡಿ, GPay ಮಾಡಿ ಸಾಕು!'",
        reply: "ಕಸ್ಟಮರ್: 'ಅರೆ ವಾವ್! 1 ಸೆಕೆಂಡಿನಲ್ಲಿ ಕನೆಕ್ಟ್ ಆಯ್ತು!'",
        voiceText: "ನೋಡಿ ತಮ್ಮಾ, WhatsApp ಬೇಡ! ಇಲ್ಲಿರೋ QR ಸ್ಕ್ಯಾನ್ ಮಾಡಿ, ಫೋನ್‌ನಲ್ಲೇ GPay ಮಾಡಿ ಸಾಕು!"
      },
      {
        id: 3,
        start: 15.0,
        end: 22.0,
        title: "ದೃಶ್ಯ 3: ಆಟೋ ಪಾವತಿ & ಲೈವ್ ಪ್ರಿಂಟ್",
        speaker: "customer",
        dialogue: "ಕಸ್ಟಮರ್: 'ಅದ್ಭುತ! GPay ಆಗ್ತಿದ್ದಂತೆ ಪ್ರಿಂಟರ್‌ನಿಂದ ಪ್ರಿಂಟ್ ಬಂತು!'",
        reply: "ಅಂಗಡಿಯವರು: '100% ಆಟೋಮ್ಯಾಟಿಕ್ ಸಿಸ್ಟಮ್ ತಮ್ಮಾ!'",
        voiceText: "ಅರೆ ವಾವ್! GPay ಆಗ್ತಿದ್ದಂತೆ ಪ್ರಿಂಟರ್‌ನಿಂದ ಪ್ರಿಂಟ್ ಬಂತು! ಎಷ್ಟು ಸುಲಭ ಮತ್ತು ಫಾಸ್ಟ್!"
      },
      {
        id: 4,
        start: 22.0,
        end: 26.5,
        title: "ದೃಶ್ಯ 4: 100% ಗೌಪ್ಯತೆ & ರಶ್ ಫ್ರೀ ಶಾಪ್",
        speaker: "shopkeeper",
        dialogue: "ಅಂಗಡಿಯವರು: 'ಫೈಲ್ ತಕ್ಷಣ ಡಿಲೀಟ್ ಆಗುತ್ತೆ, ರಶ್ ಇಲ್ಲ, ಗ್ಯಾಲರಿ ಫುಲ್ ಆಗೋ ಆತಂಕವಿಲ್ಲ!'",
        reply: "ಒಬ್ಬನೇ ವ್ಯಕ್ತಿ ನೂರಾರು ಪ್ರಿಂಟ್ ಸುಲಭವಾಗಿ ನಿಭಾಯಿಸಬಹುದು!",
        voiceText: "ಫೈಲ್ ತಕ್ಷಣ ಆಟೋ ಡಿಲೀಟ್ ಆಗುತ್ತೆ! ರಶ್ ಇಲ್ಲ, ಗ್ಯಾಲರಿ ಫುಲ್ ಆಗೋ ಆತಂಕವಿಲ್ಲ!"
      },
      {
        id: 5,
        start: 26.5,
        end: 32.0,
        title: "ದೃಶ್ಯ 5: ಅಮೀರ್ ಸೋಲಾಪುರ್ - 7760606262",
        speaker: "narrator",
        dialogue: "ನಿಮ್ಮ ಅಂಗಡಿಗೂ ಇಂದೇ ಅಳವಡಿಸಿ: ಅಮೀರ್ ಸೋಲಾಪುರ್ - 7760606262",
        reply: "ಕರ್ನಾಟಕ ಅಧಿಕೃತ ವಿತರಕರು • ಉಚಿತ ಲೈವ್ ಡೆಮೊ ಲಭ್ಯವಿದೆ!",
        voiceText: "ನಿಮ್ಮ ಝೆರಾಕ್ಸ್ ಅಂಗಡಿಗೂ ಇಂದೇ ಕ್ವಿಕ್‌ಪ್ರಿಂಟ್ ಅಳವಡಿಸಿ. ಲೈವ್ ಡೆಮೊಗಾಗಿ ಸಂಪರ್ಕಿಸಿ: ಅಮೀರ್ ಸೋಲಾಪುರ್, 7760606262!"
      }
    ];

    let spokenScenes = new Set();

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (isMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 'beep') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, t);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, t);
          osc.frequency.setValueAtTime(880, t + 0.1);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
          osc.start(t);
          osc.stop(t + 0.5);
        } else if (type === 'print') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(85, t);
          osc.frequency.exponentialRampToValueAtTime(150, t + 0.5);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
          osc.start(t);
          osc.stop(t + 0.5);
        }
      } catch (e) {}
    }

    function speakKannada(text, speaker) {
      if (isMuted || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.05;
        
        if (speaker === 'customer') {
          utter.pitch = 1.25;
        } else if (speaker === 'shopkeeper') {
          utter.pitch = 0.95;
        } else {
          utter.pitch = 1.05;
        }

        const voices = window.speechSynthesis.getVoices();
        const knVoice = voices.find(v => v.lang.includes('kn') || v.lang.includes('KN')) || 
                        voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
        if (knVoice) utter.voice = knVoice;

        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function startVideoWithSound() {
      initAudio();
      startOverlay.style.display = 'none';
      currentTime = 0;
      spokenScenes.clear();
      isPlaying = true;
      btnPlayPause.innerText = '⏸';
      requestAnimationFrame(gameLoop);
    }

    function togglePlay() {
      initAudio();
      isPlaying = !isPlaying;
      btnPlayPause.innerText = isPlaying ? '⏸' : '▶';
      if (isPlaying) {
        lastTimestamp = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      btnMute.innerText = isMuted ? '🔇' : '🔊';
      if (isMuted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function restartVideo() {
      initAudio();
      currentTime = 0;
      spokenScenes.clear();
      isPlaying = true;
      btnPlayPause.innerText = '⏸';
      startOverlay.style.display = 'none';
      lastTimestamp = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function seekVideo(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      currentTime = pct * TOTAL_DURATION;
      spokenScenes.clear();
      drawFrame(currentTime);
    }

    function setAspect(mode) {
      const wrap = document.getElementById('playerWrapper');
      const btnR = document.getElementById('btnReelMode');
      const btnW = document.getElementById('btnWideMode');
      if (mode === 'reel') {
        wrap.className = 'player-container reel-mode';
        canvas.width = 720;
        canvas.height = 1280;
        btnR.classList.add('active');
        btnW.classList.remove('active');
      } else {
        wrap.className = 'player-container landscape-mode';
        canvas.width = 1280;
        canvas.height = 720;
        btnW.classList.add('active');
        btnR.classList.remove('active');
      }
      drawFrame(currentTime);
    }

    function gameLoop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000.0;
      lastTimestamp = timestamp;

      currentTime += delta;
      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        isPlaying = false;
        btnPlayPause.innerText = '▶';
        drawFrame(currentTime);
        return;
      }

      drawFrame(currentTime);
      requestAnimationFrame(gameLoop);
    }

    function drawFrame(t) {
      const W = canvas.width;
      const H = canvas.height;
      const isReel = H > W;

      const pct = (t / TOTAL_DURATION) * 100;
      progressFill.style.width = pct + '%';
      
      const curSec = Math.floor(t);
      timeDisplay.innerText = `0:${curSec < 10 ? '0' : ''}${curSec} / 0:32`;

      const scene = SCENES.find(s => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
      sceneIndicator.innerText = scene.title;

      if (!spokenScenes.has(scene.id) && isPlaying) {
        spokenScenes.add(scene.id);
        speakKannada(scene.voiceText, scene.speaker);
        if (scene.id === 2) playSound('beep');
        if (scene.id === 3) {
          playSound('success');
          setTimeout(() => playSound('print'), 700);
        }
      }

      drawRealisticShop(W, H, isReel, t, scene);
      drawDialogueOverlay(scene, W, H, isReel, t);
    }

    function drawRealisticShop(W, H, isReel, t, scene) {
      const wallGrad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
      wallGrad.addColorStop(0, '#1e293b');
      wallGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(W * 0.1, isReel ? 120 : 40, W * 0.8, isReel ? 60 : 45);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.strokeRect(W * 0.1, isReel ? 120 : 40, W * 0.8, isReel ? 60 : 45);

      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 20px "Noto Sans Kannada"';
      ctx.textAlign = 'center';
      ctx.fillText("🏛️ ಕರ್ನಾಟಕ ಸಿಎಸ್‌ಸಿ & ಝೆರಾಕ್ಸ್ ಕೇಂದ್ರ", W / 2, isReel ? 158 : 70);

      ctx.fillStyle = '#334155';
      ctx.fillRect(W * 0.08, isReel ? 210 : 105, W * 0.28, 90);
      for (let r = 0; r < 3; r++) {
        ctx.fillStyle = r % 2 === 0 ? '#f8fafc' : '#38bdf8';
        ctx.fillRect(W * 0.1, (isReel ? 220 : 115) + r * 25, W * 0.24, 18);
      }

      const counterY = isReel ? H * 0.65 : H * 0.62;
      const counterH = H - counterY;

      const skX = W * 0.72;
      const skY = counterY - 30;
      drawRealisticShopkeeper(skX, skY, t, scene);

      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, counterY, W, counterH);

      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(0, counterY - 8, W, 12);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(0, counterY - 8, W, 4);

      drawDesktopMonitor(W * 0.58, counterY - 14, t);
      drawMultiFunctionPrinter(W * 0.82, counterY - 14, t, scene);
      drawAcrylicQRStand(W * 0.44, counterY - 14, t, scene);

      const custX = W * 0.24;
      const custY = counterY + (isReel ? 20 : 35);
      drawRealisticCustomer(custX, custY, t, scene);

      if (scene.id === 2) {
        drawLaserBeam(custX + 60, custY - 170, W * 0.44, counterY - 100, t);
      }
    }

    function drawRealisticShopkeeper(x, y, t, scene) {
      ctx.save();

      ctx.fillStyle = '#1e3a8a';

      ctx.lineTo(-40, -60);
      ctx.lineTo(40, -60);
      ctx.lineTo(50, 20);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-15, -60);
      ctx.lineTo(0, -35);
      ctx.lineTo(15, -60);
      ctx.fill();

      ctx.fillStyle = '#fbcfe8';
      ctx.fillRect(-12, -75, 24, 20);

      ctx.fillStyle = '#fcd34d';
      ctx.beginPath();
      ctx.arc(0, -95, 30, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(0, -106, 32, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-12, -100, 6, 4);
      ctx.fillRect(6, -100, 6, 4);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-14, -86, 28, 5);

      if (scene.speaker === 'shopkeeper') {
        const mouthOpen = 4 + Math.sin(t * 18) * 4;
        ctx.fillStyle = '#b91c1c';

      }

      const handY = -30 + Math.sin(t * 5) * 6;
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath();
      ctx.arc(-55, handY, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText("👉", -60, handY + 5);

      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 15px "Noto Sans Kannada"';
      ctx.textAlign = 'center';
      ctx.fillText("ಅಂಗಡಿಯವರು (Shopkeeper)", 0, -135);

      ctx.restore();
    }

    function drawRealisticCustomer(x, y, t, scene) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-28, 40, 24, 180);
      ctx.fillRect(4, 40, 24, 180);

      ctx.fillStyle = '#991b1b';
      ctx.roundRect(-35, -90, 70, 130, 12);
      ctx.fill();

      ctx.fillStyle = '#fcd34d';
      ctx.fillRect(-10, -105, 20, 20);

      ctx.beginPath();
      ctx.arc(0, -125, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(0, -136, 30, Math.PI * 0.9, Math.PI * 0.1);
      ctx.fill();

      ctx.fillRect(-10, -130, 5, 4);
      ctx.fillRect(8, -130, 5, 4);

      if (scene.speaker === 'customer') {
        const mouthOpen = 4 + Math.sin(t * 18) * 4;
        ctx.fillStyle = '#b91c1c';
        ctx.beginPath();
        ctx.ellipse(0, -112, 7, mouthOpen, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -114, 7, 0, Math.PI);
        ctx.stroke();
      }

      ctx.fillStyle = '#991b1b';
      ctx.beginPath();
      ctx.moveTo(25, -70);
      ctx.lineTo(65, -85);
      ctx.lineTo(65, -60);
      ctx.lineTo(25, -45);
      ctx.fill();

      const phoneBob = Math.sin(t * 4) * 4;
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath();
      ctx.arc(68, -75 + phoneBob, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.roundRect(65, -115 + phoneBob, 42, 80, 8);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (scene.id === 1) {
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(68, -110 + phoneBob, 36, 70);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText("WhatsApp", 86, -75 + phoneBob);
      } else if (scene.id === 2) {
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(68, -110 + phoneBob, 36, 70);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText("UPLOAD", 86, -75 + phoneBob);
      } else {
        ctx.fillStyle = '#15803d';
        ctx.fillRect(68, -110 + phoneBob, 36, 70);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText("₹10 ✅", 86, -75 + phoneBob);
      }

      ctx.fillStyle = '#60a5fa';
      ctx.font = 'bold 15px "Noto Sans Kannada"';
      ctx.textAlign = 'center';
      ctx.fillText("ಗ್ರಾಹಕ (Customer)", 0, -165);

      ctx.restore();
    }

    function drawAcrylicQRStand(x, y, t, scene) {
      ctx.save();

      ctx.fillStyle = '#ffffff';

    function drawDesktopMonitor(x, y, t) {

    function drawMultiFunctionPrinter(x, y, t, scene) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = '#334155';
      ctx.roundRect(-65, -95, 130, 95, 8);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.roundRect(-60, -92, 120, 25, 4);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-45, -35, 90, 15);

      if (scene.id >= 3) {
        const paperDrop = Math.min(45, (t - 15.0) * 22);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-38, -30, 76, paperDrop);
        ctx.strokeStyle = '#cbd5e1';
        ctx.strokeRect(-38, -30, 76, paperDrop);

        ctx.fillStyle = '#94a3b8';
        for (let l = 0; l < 4; l++) {
          if (paperDrop > (l + 1) * 8) {

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px sans-serif';

      ctx.fillStyle = '#22c55e';

    function drawLaserBeam(x1, y1, x2, y2, t) {
      ctx.save();
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 18;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(34, 197, 94, 0.4)';
      ctx.beginPath();
      ctx.arc(x2, y2, 20 + Math.sin(t * 12) * 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawDialogueOverlay(scene, W, H, isReel, t) {
      const topY = isReel ? 190 : 85;

      ctx.save();

      ctx.roundRect(W * 0.06, topY, W * 0.88, isReel ? 110 : 85, 14);

      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 18px "Noto Sans Kannada"';
      ctx.textAlign = 'center';

      ctx.fillStyle = '#ffffff';

      ctx.font = '700 19px "Plus Jakarta Sans"';
      ctx.fillStyle = '#93c5fd';

      ctx.fillStyle = '#ffffff';
      ctx.roundRect(cx - 230, cy - 20, 460, 85, 14);

      ctx.fillStyle = '#15803d';
      ctx.font = 'bold 15px "Noto Sans Kannada"';

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 38px "Plus Jakarta Sans"';

      ctx.roundRect(cx - 250, cy + 85, 500, 44, 10);

      ctx.font = 'bold 16px "Noto Sans Kannada"';
      ctx.fillText("🎉 ಉಚಿತ ಲೈವ್ ಡೆಮೊ & ಇನ್‌ಸ್ಟಾಲೇಶನ್‌ಗಾಗಿ ಇಂದೇ ಕರೆ ಮಾಡಿ!", cx, cy + 114);
    }

    function startExportMP4() {
      initAudio();
      recordedChunks = [];
      const stream = canvas.captureStream(30);

      const mimeTypes = [
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      let selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

      mediaRecorder = new MediaRecorder(stream, { mimeType: selectedMime });
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const ext = selectedMime.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: selectedMime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `QuickPrint_Kannada_Promotional_Video.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        alert(`✅ ವಿಡಿಯೋ ಯಶಸ್ವಿಯಾಗಿ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ! (QuickPrint_Kannada_Promotional_Video.${ext})`);
      };

      mediaRecorder.start();
      restartVideo();

      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }, (TOTAL_DURATION + 0.5) * 1000);
    }

    drawFrame(0);
  </script>
